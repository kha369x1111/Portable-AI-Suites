# ==================================================
#  إعدادات PrivateDocs AI — حزمة الخصوصية المطلقة
#  عدِّل القيم ثم احفظ. ملاحظة: لا مسافات حول علامة =
# ==================================================

# منفذ الخدمة المحلية (لكل منتج منفذ مختلف لتشغيل أكثر من منتج معاً)
PORT=8801

# حجم نافذة السياق: ذاكرة النموذج. أكبر = يستوعب مستندات/محادثات أطول
# لكن يستهلك ذاكرة RAM أكبر (16K يستوعب مستندات من ~40 صفحة في الرسالة الواحدة)
CONTEXT_SIZE=16384

# تسريع كرت الشاشة:  AUTO = استخدام GPU تلقائياً إن وُجد  |  0 = المعالج فقط
GPU_LAYERS=AUTO

# عدد خيوط المعالج:  0 = تلقائي (يستخدم كل الأنوية المتاحة)
THREADS=0

# درجة الحرارة (مستوى الإبداع): قيم أدنى = إجابات أدق وأكثر انضباطاً
TEMPERATURE=0.3

# اسم ملف النموذج داخل مجلد models  أو  AUTO لاختيار الأكبر تلقائياً
MODEL_FILE=AUTO

# وسائط إضافية متقدمة لمحرك llama-server (لا تغيّرها قبل قراءة docs/TECHNICAL.md)
EXTRA_ARGS=--jinja
